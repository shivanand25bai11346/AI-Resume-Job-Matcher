<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — JobMatch AI</title>
  <meta name="description" content="Sign in to your JobMatch AI account to sync resumes, match history, and skill gap roadmaps." />
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-page-wrapper">
    <!-- Center Authentication Card -->
    <div class="auth-card">
      
      <!-- Left Side: Form Controls -->
      <div class="auth-form-column">
        
        <div class="auth-brand-row">
          <div class="auth-brand-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
            </svg>
            <span>JOBMATCH <strong>AI</strong></span>
          </div>
        </div>

        <div class="auth-header">
          <h1 class="auth-title">Hello Again!</h1>
          <p class="auth-subtitle">Sign in to access your resumes &amp; AI match roadmaps</p>
        </div>

        <form class="login-form" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
          
          <!-- Email Field -->
          <div class="input-field-group">
            <input 
              type="email" 
              id="login-email" 
              class="pill-input" 
              placeholder="Email" 
              required 
              autocomplete="email"
            />
          </div>

          <!-- Password Field with Visibility Toggle -->
          <div class="input-field-group password-group">
            <input 
              type="password" 
              id="login-password" 
              class="pill-input" 
              placeholder="Password" 
              required 
              autocomplete="current-password"
            />
            <button 
              type="button" 
              class="password-toggle-btn" 
              id="password-toggle-btn" 
              aria-label="Toggle password visibility"
            >
              <!-- Eye Slash Icon (Default hidden) -->
              <svg class="eye-icon eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <!-- Eye Open Icon -->
              <svg class="eye-icon eye-on hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <!-- Recovery Password Link -->
          <div class="recovery-row">
            <a href="#" class="recovery-link" id="recovery-link">Recovery Password</a>
          </div>

          <!-- Sign In Button -->
          <button type="submit" class="btn-sign-in" id="sign-in-btn">
            <span>Sign In</span>
          </button>

          <!-- Divider -->
          <div class="divider-row">
            <span class="divider-text">Or continue with</span>
          </div>

          <!-- Social Login Buttons -->
          <div class="social-login-row">
            <!-- Google -->
            <button type="button" class="social-btn btn-google" id="social-google" title="Sign in with Google">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
            </button>

            <!-- Apple (Elevated Card in screenshot) -->
            <button type="button" class="social-btn btn-apple elevated" id="social-apple" title="Sign in with Apple">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#000000">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.9.04-2 .6-2.65 1.35-.55.63-1.03 1.68-.9 2.71 1 .08 2.02-.44 2.63-1.19z"/>
              </svg>
            </button>

            <!-- Facebook -->
            <button type="button" class="social-btn btn-facebook" id="social-facebook" title="Sign in with Facebook">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
            </button>
          </div>

          <!-- Back to Matcher link -->
          <div class="back-link-row">
            <a href="index.html" class="back-home-link">
              <span>← Back to JobMatch AI</span>
            </a>
          </div>

        </form>
      </div>

      <!-- Right Side: Serene Landscape Artwork Carousel -->
      <div class="auth-visual-column">
        <div class="scenic-art-card">
          <img 
            src="images/login-landscape.jpg" 
            alt="Scenic mountain sunset winter landscape" 
            class="scenic-bg-img"
            id="scenic-img"
          />
          
          <div class="scenic-overlay-gradient"></div>

          <!-- Floating Caption & Carousel Controls -->
          <div class="scenic-caption-container">
            <p class="scenic-quote" id="scenic-quote-text">
              Finally, all your work in one place.
            </p>

            <div class="carousel-nav-arrows">
              <button type="button" class="carousel-btn" id="carousel-prev" aria-label="Previous quote">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
              </button>
              <button type="button" class="carousel-btn" id="carousel-next" aria-label="Next quote">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Password Visibility Toggle
    const passwordInput = document.getElementById('login-password');
    const passwordToggleBtn = document.getElementById('password-toggle-btn');
    const eyeOff = passwordToggleBtn.querySelector('.eye-off');
    const eyeOn = passwordToggleBtn.querySelector('.eye-on');

    passwordToggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeOff.classList.toggle('hidden', isPassword);
      eyeOn.classList.toggle('hidden', !isPassword);
    });

    // Carousel Quotes Transition
    const quotes = [
      "Finally, all your work in one place.",
      "Match your resume to your dream job in seconds.",
      "AI-powered skill gap roadmaps for your engineering career.",
      "Neural ATS scoring with Apache PDFBox precision."
    ];
    let currentQuoteIndex = 0;
    const quoteElem = document.getElementById('scenic-quote-text');
    const prevBtn = document.getElementById('carousel-prev');
    const nextBtn = document.getElementById('carousel-next');

    function updateQuote(index) {
      quoteElem.style.opacity = '0';
      quoteElem.style.transform = 'translateY(6px)';
      setTimeout(() => {
        quoteElem.textContent = quotes[index];
        quoteElem.style.opacity = '1';
        quoteElem.style.transform = 'translateY(0)';
      }, 200);
    }

    prevBtn.addEventListener('click', () => {
      currentQuoteIndex = (currentQuoteIndex - 1 + quotes.length) % quotes.length;
      updateQuote(currentQuoteIndex);
    });

    nextBtn.addEventListener('click', () => {
      currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
      updateQuote(currentQuoteIndex);
    });

    // Form Submission / Auth Simulation
    function handleLogin() {
      const email = document.getElementById('login-email').value;
      const btn = document.getElementById('sign-in-btn');
      btn.innerHTML = '<span>Signing In...</span>';
      btn.disabled = true;

      setTimeout(() => {
        alert(`Welcome back, ${email}! Redirecting to Matcher Console.`);
        window.location.href = 'index.html#workspace';
      }, 700);
    }

    // Social Button Feedbacks
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const provider = btn.id.replace('social-', '');
        alert(`Redirecting to ${provider.toUpperCase()} OAuth authentication...`);
      });
    });

    document.getElementById('recovery-link').addEventListener('click', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value || 'your registered email';
      alert(`Password reset instructions have been sent to ${email}`);
    });
  </script>
</body>
</html>
